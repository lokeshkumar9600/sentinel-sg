<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Max-Temp | Prediction Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header__brand">
        <div class="header__logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="12" stroke="url(#grad)" stroke-width="2"/>
            <path d="M14 6 L14 14 L20 18" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
            <defs><linearGradient id="grad" x1="0" y1="0" x2="28" y2="28"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
          </svg>
        </div>
        <div class="header__titles">
          <h1>Max-Temp</h1>
          <span class="header__subtitle">Prediction Terminal</span>
        </div>
      </div>

      <div class="header__status">
        <div class="status-pill" id="conn-pill">
          <span class="status-pill__dot"></span>
          <span class="status-pill__text">Connecting...</span>
        </div>
        <div class="header__clock" id="clock">--:--:-- SGT</div>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main">
      <!-- Hero: Prediction -->
      <section class="hero">
        <div class="hero__main">
          <div class="hero__label">Predicted Max Temp</div>
          <div class="hero__value" id="pred-value">--°C</div>
          <div class="hero__stderr" id="pred-stderr">±--°C</div>
        </div>
        <div class="hero__chart" id="pred-chart"></div>
      </section>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-bar__item">
          <span class="status-bar__label">Updated</span>
          <span class="status-bar__value" id="last-updated">--</span>
        </div>
        <div class="status-bar__item">
          <span class="status-bar__label">Next Poll</span>
          <span class="status-bar__value"><span id="countdown">--</span>s</span>
        </div>
        <div class="status-bar__item">
          <span class="status-bar__label">Event</span>
          <span class="status-bar__value" id="event-note">--</span>
        </div>
        <div class="status-bar__item status-bar__item--feed" id="feed-status">
          <span class="status-bar__dot"></span>
          <span>price feed --</span>
        </div>
      </div>

      <!-- Two Column Layout -->
      <div class="grid">
        <!-- Left: Conditions -->
        <aside class="card conditions-card">
          <h2 class="card__title">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2v2m0 10v2M2 9h2m10 0h2M4.93 4.93l1.41 1.41m7.32 7.32l1.41 1.41M4.93 19.07l1.41-1.41m7.32-7.32l1.41-1.41"/></svg>
            Conditions
          </h2>
          <div class="conditions" id="conditions"></div>
        </aside>

        <!-- Right: Trades -->
        <div class="trades-section">
          <!-- Open Positions -->
          <section class="card positions-card">
            <h2 class="card__title">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
              Open Positions
            </h2>
            <div class="tablewrap">
              <table class="table" id="positions-table">
                <thead>
                  <tr>
                    <th>Bracket</th>
                    <th>Side</th>
                    <th class="t-right">Entry</th>
                    <th class="t-right">Now</th>
                    <th class="t-right">P&L</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="positions-body"><tr><td colspan="6" class="emptystate">No open positions</td></tr></tbody>
              </table>
            </div>
          </section>

          <!-- Brackets -->
          <section class="card brackets-card">
            <h2 class="card__title">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
              Brackets
            </h2>
            <div class="tablewrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Bracket</th>
                    <th class="t-right">Model</th>
                    <th class="t-right" title="Best ask — what you pay to buy YES">Yes ↗</th>
                    <th class="t-right" title="NegRisk: what you pay to short">No ↗</th>
                    <th>Action</th>
                    <th class="t-right">Edge</th>
                    <th class="t-right">Stake</th>
                  </tr>
                </thead>
                <tbody id="brackets-body"><tr><td colspan="7" class="emptystate">Loading...</td></tr></tbody>
              </table>
            </div>
            <div class="brackets-foot" id="brackets-foot"></div>
          </section>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn btn--secondary" id="refresh-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5M4 16a8 8 0 0114.32-4.9M20 8a8 8 0 01-14.32 4.9"/></svg>
        Refresh
      </button>
      <div class="footer__links">
        <a href="https://polymarket.com" target="_blank">Polymarket</a>
        <span class="divider">·</span>
        <a href="https://weather.gov.sg" target="_blank">NEA</a>
      </div>
    </footer>
  </div>

  <div class="errorbar" id="errorbar" hidden></div>
  <script src="app.js"></script>
</body>
</html>

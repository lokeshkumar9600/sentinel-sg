version: '3.8'

services:
  sentinel:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_GOV_API_KEY=${DATA_GOV_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
